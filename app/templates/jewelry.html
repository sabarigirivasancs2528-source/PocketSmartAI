{% extends "base.html" %}

{% block content %}

<div class="heading">

    <span>
        PLANNER 03
    </span>

    <h1>
        Jewelry Planner
    </h1>

</div>


<form
    id="jewelryForm"
    class="card planner"
    enctype="multipart/form-data"
>

    <label>

        Budget ₹

        <input
            name="budget"
            type="number"
            min="1"
            required
        >

    </label>


    <label>

        Occasion

        <input
            name="occasion"
            value="Wedding"
        >

    </label>


    <label>

        Style

        <input
            name="style"
            value="elegant"
        >

    </label>


    <label>

        Outfit color

        <input
            name="outfit_color"
            placeholder="Pink, black, gold..."
        >

    </label>


    <label>

        Notes

        <textarea
            name="notes"
        ></textarea>

    </label>


    <label>

        Outfit image

        <input
            name="outfit_image"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        >

    </label>


    <button class="btn">
        Generate Plan
    </button>


    <p id="msg"></p>

</form>


<div id="results"></div>

{% endblock %}


{% block scripts %}

<script>
    jewelryPlanner()
</script>

{% endblock %}
